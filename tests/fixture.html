<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extension test fixture — not a real inbox</title><script src="/test-content.js" defer></script><style>
body{margin:0;background:#101114;color:#f5f5f7;font:16px/1.6 system-ui;padding:24px}a{color:#86bcff;padding:12px;display:inline-block}button,input{font:inherit;padding:12px}main{max-width:600px;margin:auto}nav{border-bottom:1px solid #42444c}footer{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#202126}p{overflow-wrap:anywhere}
</style></head><body><main><h1>Extension test fixture</h1><p>Local test data. No Instagram account is connected.</p><nav aria-label="Test navigation"><a id="home" href="/">Home</a><a id="explore" href="/explore/">Explore</a><a id="reels" href="/reels/">Reels</a><a id="inbox" href="/direct/inbox/">Messages</a><a href="/accounts/login/">Login</a></nav><h2>Messages</h2><p id="chat">A test message remains visible.</p><button id="spa" type="button">Navigate to Explore using history</button><button id="dynamic" type="button">Add Reels link</button><button id="mutate" type="button">Change Messages link to Reels</button><a href="https://example.com/">External link</a></main><footer><label>Message <input id="composer" placeholder="Type a test message"></label></footer><script>
document.querySelector('#spa').onclick=()=>history.pushState({},'', '/explore/');
document.querySelector('#dynamic').onclick=()=>{const a=document.createElement('a');a.href='/reels/';a.id='added';a.textContent='Added Reels';document.querySelector('nav').append(a)};
document.querySelector('#mutate').onclick=()=>document.querySelector('#inbox').href='/reels/';
</script></body></html>
