<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Extension test fixture — not a real inbox</title><script src="/test-content.js" defer></script><style>
body{margin:0;background:#101114;color:#f5f5f7;font:16px/1.6 system-ui;padding:24px 24px 120px}a{color:#86bcff;padding:12px;display:inline-block}button,input{font:inherit;padding:12px}main{max-width:600px;margin:auto}nav{border-bottom:1px solid #42444c}footer{position:fixed;bottom:0;left:0;right:0;padding:12px;background:#202126}p{overflow-wrap:anywhere}
</style></head><body><h1>Extension test fixture</h1><p>Local test data. No Instagram account is connected.</p><nav aria-label="Test navigation"><a id="home" href="/">Home</a><a id="explore" href="/explore/">Explore</a><a id="reels" href="/reels/">Reels</a><a id="inbox" href="/direct/inbox/">Messages</a><a href="/accounts/login/">Login</a></nav><main><div id="stories"><a id="story" href="/stories/friend/123/">Friend story</a></div><article id="friend-video"><header><a href="/friend/">friend</a></header><a href="/p/friend/">Friend video</a><video controls muted></video><button type="button" id="photo-next" aria-label="Next">Next photo</button></article><article id="next-video"><header><a href="/stranger/">stranger</a></header><a href="/p/next/">Recommended video</a><video muted></video></article><div id="suggested">Suggested posts</div><h2>Messages</h2><p id="chat">A test message remains visible.</p><button id="spa" type="button">Navigate to Explore using history</button><button id="dynamic" type="button">Add Reels link</button><button id="mutate" type="button">Change Messages link to Reels</button><a href="https://example.com/">External link</a></main><footer><label>Message <input id="composer" placeholder="Type a test message"></label></footer><script>
// biome-ignore lint/suspicious/noDocumentCookie: Synthetic localhost session; Cookie Store is not required by the production script.
document.cookie='csrftoken=fixture-csrf;path=/';
document.querySelector('#explore').textContent='Search';
document.querySelector('nav').insertAdjacentHTML('beforeend','<a id="profile" href="/me/">Profile</a>');
window.originalNavigation=document.querySelector('nav');
document.querySelector('#spa').onclick=()=>history.pushState({},'', '/explore/');
document.querySelector('#dynamic').onclick=()=>{const a=document.createElement('a');a.href='/reels/';a.id='added';a.textContent='Added Reels';document.querySelector('nav').append(a)};
document.querySelector('#mutate').onclick=()=>document.querySelector('#inbox').href='/reels/';
if (/^\/(me|friend|stranger)\/$/.test(location.pathname)) {
const name=location.pathname.split('/')[1];
document.querySelector('main').innerHTML='<header><h2>'+name+'</h2><button type="button" id="follow">Follow</button></header><div role="tabpanel"><article id="grid-shell"><a id="grid-post" href="/p/friend/"><img width="160" height="160" alt="Test profile post" src="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22160%22 height=%22160%22%3E%3Crect width=%22160%22 height=%22160%22 fill=%22%231769e8%22/%3E%3C/svg%3E"></a></article></div><aside><a id="profile-recommended" href="/p/recommended/">Recommended post</a></aside>';
}
if (location.pathname.startsWith('/explore/')) {
document.querySelector('main').insertAdjacentHTML('afterbegin','<section role="search"><label>Search <input id="native-search" placeholder="Search"></label><div role="listbox"><a id="person-result" href="/friend/">friend</a></div></section>');
}
</script></body></html>
